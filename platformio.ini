[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.maximum_size = 1966080
lib_deps = bblanchon/ArduinoJson@7.3.1
extra_scripts = pre:scripts/cert_bundle.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
build_flags = ${env.build_flags} -DCONTACT_INVERTED=0

[env:esp32dev-inverted]
build_flags = ${env.build_flags} -DCONTACT_INVERTED=1
