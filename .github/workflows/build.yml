name: Build ESP32
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18 certifi==2026.11.20 cryptography==50.0.2
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/contact_test.cpp -o /tmp/contact-test && /tmp/contact-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/control_flow_test.cpp -o /tmp/control-flow-test && /tmp/control-flow-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/poll_schedule_test.cpp -o /tmp/poll-schedule-test && /tmp/poll-schedule-test
      - run: pio run
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -I.pio/libdeps/esp32dev/ArduinoJson/src test/mode_parser_test.cpp -o /tmp/mode-parser-test && /tmp/mode-parser-test
      - name: Package complete first-install binary
        run: |
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin dist/firmware.bin
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32 merge_bin \
            -o dist/ariston-termocamino-factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 .pio/build/esp32dev/bootloader.bin \
            0x8000 .pio/build/esp32dev/partitions.bin \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 .pio/build/esp32dev/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ariston-termocamino-esp32
          path: dist/*.bin
          if-no-files-found: error
