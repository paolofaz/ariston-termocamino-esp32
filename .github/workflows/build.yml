name: Build ESP32
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Pubblica la versione firmware come GitHub Release'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18 certifi==2026.11.20 cryptography==50.0.2
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/contact_test.cpp -o /tmp/contact-test && /tmp/contact-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/control_flow_test.cpp -o /tmp/control-flow-test && /tmp/control-flow-test
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/poll_schedule_test.cpp -o /tmp/poll-schedule-test && /tmp/poll-schedule-test
      - run: pio run
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -I.pio/libdeps/esp32dev/ArduinoJson/src test/mode_parser_test.cpp -o /tmp/mode-parser-test && /tmp/mode-parser-test
      - name: Package complete first-install binary
        run: |
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin dist/firmware.bin
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32 merge_bin \
            -o dist/ariston-termocamino-factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 .pio/build/esp32dev/bootloader.bin \
            0x8000 .pio/build/esp32dev/partitions.bin \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 .pio/build/esp32dev/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ariston-termocamino-esp32
          path: dist/*.bin
          if-no-files-found: error
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ariston-termocamino-esp32
          path: dist
      - name: Publish versioned firmware binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^constexpr char VERSION\[\]="([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' src/main.cpp)"
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite assets."
            exit 0
          fi
          (cd dist && sha256sum firmware.bin ariston-termocamino-factory.bin > SHA256SUMS.txt)
          cat > /tmp/release-notes.md <<'EOF'
          Firmware ESP32-WROOM-32 (4 MB).
          
          - `firmware.bin`: aggiornamento OTA, conserva le impostazioni.
          - `ariston-termocamino-factory.bin`: prima installazione USB, indirizzo 0x0.
          - `SHA256SUMS.txt`: checksum dei due file.
          
          La pubblicazione avviene solo dopo compilazione e test automatici riusciti.
          Per configurazione, collegamenti, funzionalità e limiti consultare il README.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --title "Ariston Termocamino ESP32 $version" --notes-file /tmp/release-notes.md dist/firmware.bin dist/ariston-termocamino-factory.bin dist/SHA256SUMS.txt
