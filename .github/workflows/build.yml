name: Build ESP32
on:
  push:
    branches: [sviluppo, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18 certifi cryptography
      - run: c++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/contact_test.cpp -o /tmp/contact-test && /tmp/contact-test
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: ariston-termocamino-esp32-dev
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
